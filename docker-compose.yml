services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      EXAM_PREP_DEMO_MODE: "false"
      EXAM_PREP_FRONTEND_ORIGIN: ${EXAM_PREP_FRONTEND_ORIGIN:-http://localhost:3000}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - exam-prep-data:/data

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  exam-prep-data:

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "exam-prep-agent"
version = "0.1.0"
description = "Local-first exam preparation platform for grounded study, quiz generation, and mock exams."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "langchain>=0.3,<0.4",
  "langchain-core>=0.3,<0.4",
  "langgraph>=0.2,<0.3",
  "numpy>=1.26,<2.0",
  "httpx>=0.27,<1.0",
  "pypdf>=5.4,<6.0",
  "PyMuPDF>=1.24,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "torch>=2.13,<3.0; sys_platform != 'darwin' or platform_machine != 'x86_64'"
]

[project.scripts]
study-package = "exam_prep.packages.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<6.0",
  "mypy>=1.11,<1.20",
  "ruff==0.16.2"
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/exam_prep"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
plugins = []
strict = true
mypy_path = "backend/src"
